<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="104.7742mm" viewBox="0 0 510.24 297">
<rect width="100%" height="100%" fill="white"/>
<text x="255.12" y="15.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="12" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">常见护肤误区与科学建议</text>
<text x="121" y="38.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.7" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">需要警惕的做法</text>
<text x="389" y="38.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.7" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">可采用的调整</text>
<rect x="18" y="51" width="205" height="37" rx="3" fill="#f3eee5" stroke="#b9c8cd" stroke-width="0.7"/>
<rect x="287" y="51" width="205" height="37" rx="3" fill="#eef4f5" stroke="#b9c8cd" stroke-width="0.7"/>
<text x="120.5" y="63.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">过度清洁</text>
<text x="120.5" y="78.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">反复去油、揉搓</text>
<text x="389.5" y="63.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">温和清洁</text>
<text x="389.5" y="78.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">按出汗、残留与耐受调整</text>
<polyline points="242,69 269,69" fill="none" stroke="#356b79" stroke-width="1" stroke-linejoin="round"/>
<polygon points="269,69 264.4951556604879,71.1694186955878 264.4951556604879,66.8305813044122" fill="#356b79"/>
<rect x="18" y="94" width="205" height="37" rx="3" fill="#f3eee5" stroke="#b9c8cd" stroke-width="0.7"/>
<rect x="287" y="94" width="205" height="37" rx="3" fill="#eef4f5" stroke="#b9c8cd" stroke-width="0.7"/>
<text x="120.5" y="106.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">频繁去角质</text>
<text x="120.5" y="121.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">每天磨砂、加速更新</text>
<text x="389.5" y="106.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">适度护肤</text>
<text x="389.5" y="121.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">干燥、刺痛时减少刺激</text>
<polyline points="242,112 269,112" fill="none" stroke="#356b79" stroke-width="1" stroke-linejoin="round"/>
<polygon points="269,112 264.4951556604879,114.1694186955878 264.4951556604879,109.8305813044122" fill="#356b79"/>
<rect x="18" y="137" width="205" height="37" rx="3" fill="#f3eee5" stroke="#b9c8cd" stroke-width="0.7"/>
<rect x="287" y="137" width="205" height="37" rx="3" fill="#eef4f5" stroke="#b9c8cd" stroke-width="0.7"/>
<text x="120.5" y="149.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">盲目叠加产品</text>
<text x="120.5" y="164.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">同时尝试多种新品</text>
<text x="389.5" y="149.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">按肤质和部位选用</text>
<text x="389.5" y="164.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">减少同时引入的新产品</text>
<polyline points="242,155 269,155" fill="none" stroke="#356b79" stroke-width="1" stroke-linejoin="round"/>
<polygon points="269,155 264.4951556604879,157.16941869558778 264.4951556604879,152.83058130441222" fill="#356b79"/>
<rect x="18" y="180" width="205" height="37" rx="3" fill="#f3eee5" stroke="#b9c8cd" stroke-width="0.7"/>
<rect x="287" y="180" width="205" height="37" rx="3" fill="#eef4f5" stroke="#b9c8cd" stroke-width="0.7"/>
<text x="120.5" y="192.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">只补水不保湿</text>
<text x="120.5" y="207.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">把暂时湿润当作持续保湿</text>
<text x="389.5" y="192.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">兼顾水合与减少失水</text>
<text x="389.5" y="207.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">按需使用耐受的乳液或面霜</text>
<polyline points="242,198 269,198" fill="none" stroke="#356b79" stroke-width="1" stroke-linejoin="round"/>
<polygon points="269,198 264.4951556604879,200.16941869558778 264.4951556604879,195.83058130441222" fill="#356b79"/>
<rect x="18" y="223" width="205" height="37" rx="3" fill="#f3eee5" stroke="#b9c8cd" stroke-width="0.7"/>
<rect x="287" y="223" width="205" height="37" rx="3" fill="#eef4f5" stroke="#b9c8cd" stroke-width="0.7"/>
<text x="120.5" y="235.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">忽视防晒</text>
<text x="120.5" y="250.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">把保湿当作全面防护</text>
<text x="389.5" y="235.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="10.8" font-weight="600" fill="#20323d" text-anchor="middle" dominant-baseline="central">重视防晒</text>
<text x="389.5" y="250.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#20323d" text-anchor="middle" dominant-baseline="central">结合遮阳、衣帽与防晒霜</text>
<polyline points="242,241 269,241" fill="none" stroke="#356b79" stroke-width="1" stroke-linejoin="round"/>
<polygon points="269,241 264.4951556604879,243.16941869558778 264.4951556604879,238.83058130441222" fill="#356b79"/>
<text x="255.12" y="284.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="9.1" font-weight="400" fill="#74838a" text-anchor="middle" dominant-baseline="central">持续或反复不适应就诊；日常护肤不能替代疾病诊疗。</text>
</svg>