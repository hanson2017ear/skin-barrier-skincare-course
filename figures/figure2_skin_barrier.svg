<text x="255.12" y="280.0" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="8.9" font-weight="400" fill="#74838a" text-anchor="middle" dominant-baseline="central">示意图，不按比例；箭头仅表示扩散方向，不表示流失量。</text>
